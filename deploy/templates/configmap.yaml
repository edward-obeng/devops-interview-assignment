apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak-stale-cleanup.fullname" . }}-config
  labels:
    {{- include "keycloak-stale-cleanup.labels" . | nindent 4 }}
data:
  KEYCLOAK_URL: {{ .Values.keycloak.url | quote }}
  KEYCLOAK_REALM: {{ .Values.realm | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.keycloak.clientId | quote }}
  INACTIVITY_DAYS: {{ .Values.cleanup.inactivityDays | quote }}
  DRY_RUN: {{ .Values.cleanup.dryRun | quote }}
  EXCLUSIONS: {{ .Values.cleanup.exclusions | quote }}
