{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keycloak-stale-cleanup.serviceAccountName" . }}
  labels:
    {{- include "keycloak-stale-cleanup.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Role/RoleBinding on purpose: this CronJob never calls the Kubernetes API,
# only Keycloak's Admin REST API over HTTP (auth via the mounted Secret). A
# dedicated ServiceAccount still exists so the workload isn't running as
# `default` and has its own identity for audit, but binding K8s RBAC to it
# would just be an unused grant. See README point 2/3.
{{- end }}
